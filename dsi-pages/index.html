<html><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>homebrew-eshop</title></head>
<body bgcolor="#ffffff" style="font-family:sans-serif;font-size:12px">
<h3>homebrew-eshop DSi Shop</h3>
<p><button onclick="kongCall('ReturnToMenu')" style="font-size:14px;padding:6px">Return to DSi Menu</button>
<button onclick="kongCall('Restart')" style="font-size:14px;padding:6px">Restart shop</button>
<span id="kongerr" style="color:#c00"></span></p>
<script type="text/javascript">
// Kong is the shop's own page helper (its built-in error pages use new Kong + ReturnToMenu()).
function kongCall(what) {
  var msg;
  try {
    var k = new Kong;
    try { k.SetTransition(0, 0); } catch (e) {} // the built-in pages say SetTransition must be called first
    setTimeout(function () { try { k[what](); } catch (e) { report("Kong." + what + " (delayed) failed: " + e); } }, 300);
    msg = "calling Kong." + what + " in 300 ms";
  } catch (e) { msg = "Kong." + what + " failed: " + e; }
  document.getElementById("kongerr").innerHTML = msg;
  report(msg);
}
// Report over BOTH channels. The XHR POST (https, same-origin) carries the full text when TLS works. But
// after GenerateKeyPair the console's HTTPS stops working, so we also beacon over plain http to the conntest
// host (port 80, no TLS): an <img> GET whose query carries the text, chunked to fit in a URL. The http
// beacon is the one that survives the post-registration failure.
var beaconSeq = 0;
function report(msg) {
  try { var x = new XMLHttpRequest(); x.open("POST", "/report", true); x.send(msg); } catch (e) {}
  try {
    var base = "http://conntest.nintendowifi.net/report?";
    var chunk = 900, n = Math.ceil(msg.length / chunk);
    for (var i = 0; i < n && i < 8; i++) {
      beaconSeq++;
      var part = "b" + beaconSeq + "/" + (i + 1) + "of" + n + ":" + msg.substring(i * chunk, i * chunk + chunk);
      var img = new Image();
      img.src = base + encodeURIComponent(part);
    }
  } catch (e) {}
}
</script>
<p>Probing the shop's ECommerceInterface...</p>
<pre id="info" style="font-size:10px"></pre>
<script type="text/javascript">
// Probe page: lists what ECommerceInterface offers and reads the getters that don't talk to a server.
// Everything is posted to /report, which the PC logs.
var out = [];
function line(s) { out.push(s); }
function describe(obj, label, depth) {
  if (depth > 2 || obj === null || obj === undefined) return;
  var keys = [];
  try { for (var k in obj) keys.push(k); } catch (e) { line(label + " (for-in failed: " + e + ")"); }
  for (var i = 0; i < keys.length; i++) {
    var v, t;
    try { v = obj[keys[i]]; t = typeof v; } catch (e) { t = "error " + e; }
    if (t == "function") { line(label + "." + keys[i] + "()"); }
    else if (t == "object" && v !== null) { line(label + "." + keys[i] + " = [object]"); describe(v, label + "." + keys[i], depth + 1); }
    else { line(label + "." + keys[i] + " = " + t + " " + String(v).substring(0, 120)); }
  }
}

function readFields(o, list, label) {
  var got = [];
  for (var i = 0; i < list.length; i++) {
    var v; try { v = o[list[i]]; } catch (e) { v = "error"; }
    if (v !== undefined) got.push(list[i] + "=" + v);
  }
  line(label + ": " + got.join(" "));
}
var ec = null;
try { line("typeof Kong: " + typeof Kong); } catch (e) { line("Kong: " + e); }
try { ec = new ECommerceInterface(); line("new ECommerceInterface(): ok"); } catch (e) { line("new ECommerceInterface() failed: " + e); }
if (ec) {
  line("--- for-in over the object");
  describe(ec, "ec", 0);
  line("--- known Wii Shop method names");
  var names = ["getDeviceInfo", "getVersion", "getProgress", "getLog", "getWebSvcUrls", "setWebSvcUrls",
    "checkDeviceStatus", "checkRegistration", "register", "syncRegistration", "unregister", "getChallenge",
    "syncTickets", "listTitles", "getTitleInfo", "getTitleInfos", "getTicketInfos", "purchaseTitle",
    "purchasePoints", "downloadTitle", "deleteTitle", "deleteTitleContent", "giftTitle", "acceptGiftTitle",
    "getSessionValue", "setSessionValue", "getPersistentValue", "setPersistentValue", "setLanguage",
    "setCountry", "setRegion", "setAge", "setParameter", "getParameter", "cancelOperation",
    "launchTitle", "refreshCachedBalance", "getCachedBalance", "getPoints", "getFreeSpace", "getNandFreeSpace",
    "setAccountId", "getAccountId", "setDeviceToken", "transfer", "listContentSets", "getEULA",
    "updateStatus", "connecting", "pubKeyEncrypt", "getSpace", "checkParentalControlPassword"];
  var have = [];
  for (var i = 0; i < names.length; i++) {
    var t; try { t = typeof ec[names[i]]; } catch (e) { t = "error"; }
    if (t != "undefined") have.push(names[i] + ":" + t);
  }
  line(have.join(" "));
  line("--- read-only getters");
  line("getVersion() = " + ec.getVersion());
  var fields = {
    info: ["deviceId", "serial", "country", "region", "language", "accountId", "deviceCode", "accountNumber",
      "isParentalControlEnabled", "userAge", "parentalControlOgn", "parentalControlAge", "isNeedTicketSync",
      "isNeedRegistration", "registrationStatus", "lastTicketSyncTime", "ticketSyncTime", "totalBlocks",
      "usedBlocks", "freeBlocks", "freeChannelAppCount", "maxUserFileSize", "titleId", "wirelessMACAddr",
      "bluetoothMACAddr", "titleVersion", "blockSize", "usedUserInodes", "maxUserInodes", "deviceType", "deviceToken"],
    progress: ["status", "operation", "description", "phase", "isCancelRequested", "totalSize", "downloadedSize",
      "errCode", "errInfo"]
  };
  var di = ec.getDeviceInfo();
  readFields(di, fields.info, "deviceInfo");
  readFields(ec.getProgress(), fields.progress, "progress (idle)");
  try { var lg = ec.getLog(); line("getLog(): " + String(lg).substring(0, 600)); } catch (e) { line("getLog threw " + e); }

  line("--- setWebSvcUrls");
  // Point every service URL at the pages host. The server routes by path (/ias/services, /ecs/services),
  // so the console only ever connects to one hostname and the single-host cert it accepts always matches.
  var ecsUrl = "https://tss.t.shop.nintendowifi.net/ecs/services/ECommerceSOAP";
  var iasUrl = "https://tss.t.shop.nintendowifi.net/ias/services/IdentityAuthenticationSOAP";
  try { line("setWebSvcUrls -> " + ec.setWebSvcUrls(ecsUrl, iasUrl)); } catch (e) { line("setWebSvcUrls threw " + e); }
}

function send() {
  report(out.join("\n"));
  out = [];
}

// Runs EC operations one after another; each returns at once and is finished when getProgress().status
// stops being the "in progress" code. The result of each is reported.
var steps = [];
if (ec && ec.getDeviceInfo().deviceId == 0) {
  steps.push(["generateKeyPair", function () { return ec.generateKeyPair(); }]);
  steps.push(["confirmKeyPair", function () { return ec.confirmKeyPair(); }]);
}
steps.push(["checkDeviceStatus", function () { return ec.checkDeviceStatus(); }]);

function runStep(i) {
  if (!ec || i >= steps.length) {
    try { line("getLog(): " + String(ec.getLog()).substring(0, 3000)); } catch (e) {}
    try { readFields(ec.getDeviceInfo(), fields.info, "deviceInfo at end"); } catch (e) {}
    line("=== done");
    show(); send();
    return;
  }
  var name = steps[i][0], r;
  try { r = steps[i][1](); line(name + "() returned " + r); show(); send(); } catch (e) { line(name + "() threw " + e); show(); send(); }
  // Poll fast and send the EC log on every tick: when an op fails the Shop jumps to its error page, which
  // destroys this script, so the last log we managed to POST is the evidence. Sending every tick beats that.
  var polls = 0, lastLog = "";
  function poll() {
    polls++;
    var st, desc, log;
    try { var p = ec.getProgress(); st = p.status; desc = "status=" + st + " phase=" + p.phase + " op=" + p.operation + " err=" + p.errCode + " " + (p.errInfo || ""); } catch (e) { desc = "getProgress threw " + e; st = 0; }
    try { log = String(ec.getLog()); } catch (e) { log = "getLog threw " + e; }
    out = [name + " #" + polls + ": " + desc];
    if (log != lastLog) { out.push(log.substring(Math.max(0, log.length - 1600))); lastLog = log; }
    send(); // POST immediately, every tick
    // Keep polling only while the op is actively working (status -4005 = busy, 1 = pending). status 0 means
    // success -> proceed to the next step; any other value is a terminal error -> report and proceed.
    if (polls < 40 && (st == -4005 || st == 1)) { setTimeout(poll, 200); return; }
    out = [name + (st == 0 ? " SUCCEEDED" : " ended status=" + st)];
    readFields(ec.getDeviceInfo(), ["deviceId", "isNeedRegistration", "registrationStatus", "deviceCode"], "after " + name);
    send();
    setTimeout(function () { runStep(i + 1); }, 400);
  }
  setTimeout(poll, 200);
}

function show() {
  document.getElementById("info").innerHTML += out.join("\n").replace(/&/g, "&amp;").replace(/</g, "&lt;") + "\n";
}
show(); send();
setTimeout(function () { runStep(0); }, 500);
</script>
</body></html>
