<html><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>homebrew-eshop</title></head>
<body bgcolor="#ffffff" style="font-family:sans-serif;font-size:12px">
<h3>homebrew-eshop DSi Shop</h3>
<p>Probing the shop's ECommerceInterface...</p>
<pre id="info" style="font-size:10px">working...</pre>
<script type="text/javascript">
// Probe page: lists what ECommerceInterface offers and reads the getters that don't talk to a server.
// Everything is posted to /report, which the PC logs.
var out = [];
function line(s) { out.push(s); }
function describe(obj, label, depth) {
  if (depth > 2 || obj === null || obj === undefined) return;
  var keys = [];
  try { for (var k in obj) keys.push(k); } catch (e) { line(label + " (for-in failed: " + e + ")"); }
  for (var i = 0; i < keys.length; i++) {
    var v, t;
    try { v = obj[keys[i]]; t = typeof v; } catch (e) { t = "error " + e; }
    if (t == "function") { line(label + "." + keys[i] + "()"); }
    else if (t == "object" && v !== null) { line(label + "." + keys[i] + " = [object]"); describe(v, label + "." + keys[i], depth + 1); }
    else { line(label + "." + keys[i] + " = " + t + " " + String(v).substring(0, 120)); }
  }
}

var ec = null;
try { ec = new ECommerceInterface(); line("new ECommerceInterface(): ok"); } catch (e) { line("new ECommerceInterface() failed: " + e); }
if (ec) {
  line("--- for-in over the object");
  describe(ec, "ec", 0);
  line("--- known Wii Shop method names");
  var names = ["getDeviceInfo", "getVersion", "getProgress", "getLog", "getWebSvcUrls", "setWebSvcUrls",
    "checkDeviceStatus", "checkRegistration", "register", "syncRegistration", "unregister", "getChallenge",
    "syncTickets", "listTitles", "getTitleInfo", "getTitleInfos", "getTicketInfos", "purchaseTitle",
    "purchasePoints", "downloadTitle", "deleteTitle", "deleteTitleContent", "giftTitle", "acceptGiftTitle",
    "getSessionValue", "setSessionValue", "getPersistentValue", "setPersistentValue", "setLanguage",
    "setCountry", "setRegion", "setAge", "setParameter", "getParameter", "cancelOperation",
    "launchTitle", "refreshCachedBalance", "getCachedBalance", "getPoints", "getFreeSpace", "getNandFreeSpace",
    "setAccountId", "getAccountId", "setDeviceToken", "transfer", "listContentSets", "getEULA",
    "updateStatus", "connecting", "pubKeyEncrypt", "getSpace", "checkParentalControlPassword"];
  var have = [];
  for (var i = 0; i < names.length; i++) {
    var t; try { t = typeof ec[names[i]]; } catch (e) { t = "error"; }
    if (t != "undefined") have.push(names[i] + ":" + t);
  }
  line(have.join(" "));
  line("--- read-only getters");
  var getters = ["getVersion", "getDeviceInfo", "getProgress", "getWebSvcUrls", "getCachedBalance"];
  for (var j = 0; j < getters.length; j++) {
    var g = getters[j];
    if (typeof ec[g] != "function") continue;
    try {
      var r = ec[g]();
      line(g + "() -> " + typeof r + " " + String(r).substring(0, 200));
      if (r && typeof r == "object") describe(r, g + "()", 1);
    } catch (e) { line(g + "() threw " + e); }
  }
}

document.getElementById("info").innerHTML = out.join("\n").replace(/&/g, "&amp;").replace(/</g, "&lt;");
try {
  var x = new XMLHttpRequest();
  x.open("POST", "/report", true);
  x.setRequestHeader("Content-Type", "text/plain");
  x.send(out.join("\n"));
} catch (e) {
  var img = new Image(); img.src = "/report?" + encodeURIComponent(out.join("\n").substring(0, 1500));
}
</script>
</body></html>
